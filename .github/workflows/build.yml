name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:            # lets you produce a fresh artifact on demand (e.g. after one expires)

jobs:
  build:
    runs-on: windows-latest     # match the deploy runner (Web Deploy is Windows-only)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Unit tests only - the E2E suite is [Explicit] and lives in a separate solution, so it's skipped here.
      - name: Test
        run: dotnet test ODK.slnx -c Release

      # Publish WITHOUT secrets - they're injected at deploy time, so nothing sensitive is stored in the
      # artifact.
      - name: Publish
        run: dotnet publish ODK.Web.Razor/ODK.Web.Razor.csproj -c Release -o publish

      # Self-contained EF migration bundle - a standalone exe the deploy's migrate job runs with just a
      # connection string (no SDK/source on the target). dotnet-ef is a local tool, so restore it first.
      # Bundling instantiates OdkContext at design time (to read the model), which builds the app host and
      # needs a connection string present - it never connects here, so a placeholder is enough. The REAL
      # connection string is supplied at apply time via `efbundle --connection`.
      - name: Create migration bundle
        env:
          ConnectionStrings__Default: Server=placeholder;Database=placeholder;
        run: |
          dotnet tool restore
          dotnet ef migrations bundle --configuration Release --self-contained -r win-x64 --output efbundle.exe --force `
            --project ODK.Data.EntityFramework.Migrations --startup-project ODK.Web.Razor

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: efbundle.exe
          retention-days: 7
