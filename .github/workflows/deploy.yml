name: Deploy
run-name: Deploy to prod (migrate + both sites)

on:
  # Auto: fire when a Build completes on master (the `if` on the setup job restricts to successful ones).
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]
    branches: [ master ]
  # Manual: re-run the full migrate + deploy-both flow against the latest successful master Build.
  workflow_dispatch:

permissions:
  contents: read
  actions: read           # gh run download needs to read artifacts from the Build run

# Serialise deploys so two runs can't touch prod at once; don't cancel an in-flight deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Resolve which Build run's artifacts to ship, so migrate and deploy use the SAME build.
  setup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve Build run to deploy
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"        # the exact Build that triggered us
          else
            run_id=$(gh run list --workflow build.yml --branch master --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')          # manual: latest green master Build
          fi
          if [ -z "$run_id" ]; then echo "No successful Build run found on master." >&2; exit 1; fi
          echo "Deploying artifacts from Build run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  # Apply EF migrations to the shared prod DB ONCE, before any site deploys. Runs in its own environment so a
  # required reviewer can be added later (Settings -> Environments -> prod-migrate) to gate it without any YAML
  # change. NOTE: migrate-before-deploy is only safe for backward-compatible (expand-then-contract) migrations.
  migrate:
    needs: setup
    runs-on: windows-latest
    environment: prod-migrate
    steps:
      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: efbundle
          path: bundle
          run-id: ${{ needs.setup.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: dopplerhq/cli-action@v3

      # efbundle is self-contained, so it needs only the connection string (pulled from Doppler; the service
      # token scopes the project/config). A migration failure fails this job and blocks deploy (needs: migrate).
      - name: Apply migrations
        shell: pwsh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          $conn = (doppler secrets get CONNECTIONSTRINGS_DEFAULT --plain | Out-String).Trim()
          if (-not $conn) { throw "Could not read CONNECTIONSTRINGS_DEFAULT from Doppler." }
          # efbundle constructs OdkContext via the design-time factory (OdkContextFactory), which reads the
          # connection string from ConnectionStrings__Default; --connection names the migration target too.
          $env:ConnectionStrings__Default = $conn
          & "bundle/efbundle.exe" --connection "$conn"
          if ($LASTEXITCODE -ne 0) { throw "Migration failed with exit code $LASTEXITCODE." }

  # Deploy the SAME artifact to both sites in parallel. Each matrix leg runs in its own environment, so the
  # env-scoped HOSTING_* secrets (and any per-site Variables) resolve to that site's values.
  deploy:
    needs: [ setup, migrate ]
    runs-on: windows-latest     # Web Deploy (msdeploy) is a Windows tool; the runner has it pre-installed
    strategy:
      fail-fast: false          # if one site fails, still attempt the other
      matrix:
        environment: [ prod-odk, prod-gs ]
    environment: ${{ matrix.environment }}   # scopes HOSTING_* below to this site's values
    steps:
      # Grab the app artifact from the resolved Build run (no rebuild). The same artifact ships to both
      # platforms - the app is platform-agnostic (platform inferred from the URL).
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: publish
          run-id: ${{ needs.setup.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: dopplerhq/cli-action@v3

      # Build appsettings.Production.json from Doppler, which is the single source of deploy-time production
      # config - credentials and non-secret values alike (Platforms:*:Urls, RateLimiting:BlockPatterns, ...).
      # Config that is public and identical in every environment stays in the committed appsettings.json
      # instead - a platform's Name, but not its Urls. Doppler's JSON import delimits
      # config levels with "_" (e.g. PAYMENTS_STRIPE_PLATFORMS_DEFAULT_WEBHOOKSECRETV1) which we convert to ":" -
      # unambiguous because no config-key segment contains an underscore. .NET matches keys case-insensitively,
      # so a flat "ConnectionStrings:Default" key overrides the nested one from the base appsettings.json.
      # Arrays come from Doppler two ways: a value that is JSON ([...]/{...}) is parsed and injected as real
      # structure (needed for arrays of objects like Logging:IgnoreExceptions, and for plain lists like
      # PLATFORMS_DEFAULT_URLS); a small set of string-array keys ($stringListKeys below, e.g.
      # RateLimiting:BlockPatterns) is instead a newline-delimited plain-text list so the raw regexes can be
      # edited without JSON escaping. The two are mutually exclusive, and a key outside $stringListKeys whose
      # value is not JSON binds to null rather than to an array. DOPPLER_TOKEN is a read-only service token
      # scoped to the prod config - the app never calls Doppler; this step is the only caller.
      - name: Build appsettings.Production.json (from Doppler)
        shell: pwsh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # Optional per-environment, non-sensitive overrides - see $environmentOverrides below.
          HANGFIRE_SCHEMANAME: ${{ vars.HANGFIRE_SCHEMANAME }}
          LOGGING_PATH: ${{ vars.LOGGING_PATH }}
        run: |
          $config = [pscustomobject]@{}
          $flat = doppler secrets download --no-file --format json | ConvertFrom-Json

          # Keys whose Doppler value is a newline-delimited plain-text list - one entry per line, NO JSON
          # escaping - so string arrays (e.g. regex blocklists) can be edited as raw text in Doppler. Handled
          # BEFORE the JSON auto-detect so an entry that happens to start with '[' isn't mistaken for JSON.
          $stringListKeys = @('RateLimiting:BlockPatterns', 'RateLimiting:BlockIpAddresses', 'RateLimiting:BlockPaths')

          foreach ($prop in $flat.PSObject.Properties) {
            if ($prop.Name.StartsWith('DOPPLER_')) { continue }   # skip Doppler's own metadata entries
            $key = $prop.Name -replace '_', ':'
            $value = $prop.Value
            if ($stringListKeys -contains $key) {                 # -contains is case-insensitive
              # Split on CRLF/LF into an array; trim each entry and drop blank lines.
              $value = @("$value" -split '\r?\n' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' })
            }
            else {
              $trimmed = "$value".Trim()
              if ($trimmed.StartsWith('[') -or $trimmed.StartsWith('{')) {
                try { $value = $trimmed | ConvertFrom-Json } catch { }   # leave as string if not valid JSON
              }
            }
            $config | Add-Member -NotePropertyName $key -NotePropertyValue $value -Force
          }
          # Per-environment non-sensitive overrides come from GitHub environment Variables (viewable, not secrets).
          # Each is injected only when set, so it stays optional; a key here must NOT also live in Doppler.
          # A new per-site key is a line here plus a matching entry in the step's env block above.
          $environmentOverrides = [ordered]@{
            'Hangfire:SchemaName' = $env:HANGFIRE_SCHEMANAME
            'Logging:Path'        = $env:LOGGING_PATH
          }
          foreach ($override in $environmentOverrides.GetEnumerator()) {
            if ($override.Value) {
              $config | Add-Member -NotePropertyName $override.Key -NotePropertyValue $override.Value -Force
            }
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content "publish/appsettings.Production.json" -Encoding utf8

      # Push to this site over Web Deploy. HOSTING_* resolve to the matrix environment's values.
      # Run under cmd, NOT pwsh: msdeploy re-parses the raw command line and expects the quoted
      # -dest:key="value",key2="value2" provider syntax that VS/MSBuild emit. PowerShell rewrites those
      # embedded quotes (even via the --% stop-parsing token), so msdeploy rejects the result with
      # "Unrecognized argument ... All arguments must begin with -". cmd passes the quotes through verbatim.
      # %VAR% come from this step's env; the password must not contain a literal % (cmd variable delimiter).
      # DoNotDeleteRule: don't delete server files missing from the publish (logs, uploads, App_Data).
      # AppOffline: drop app_offline.htm during the copy so IIS releases the dll lock, then remove it.
      - name: Web Deploy
        shell: cmd
        env:
          MSDEPLOY_URL: ${{ secrets.HOSTING_MSDEPLOY_URL }}
          SITE: ${{ secrets.HOSTING_SITE }}
          USER: ${{ secrets.HOSTING_USER }}
          PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
        run: >
          "%ProgramFiles%\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          -verb:sync
          -source:contentPath="%GITHUB_WORKSPACE%\publish"
          -dest:contentPath="%SITE%",computerName="%MSDEPLOY_URL%",userName="%USER%",password="%PASSWORD%",authtype="Basic"
          -allowUntrusted
          -enableRule:DoNotDeleteRule
          -enableRule:AppOffline
