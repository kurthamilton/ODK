name: CI

# Build and test run as separate, self-contained jobs so they surface as two independent status
# checks. They run in parallel, so a flaky client-library restore in one cannot fail the other's
# check. Require both as status checks on master to gate merges.
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

# Cancel an in-progress run for the same PR/branch when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The web project's build restores its client-side libraries from npm (see the RestoreClientLibraries
      # target in ODK.Web.Razor.csproj), so the runner needs Node. Installing them here rather than leaving it
      # to the build keeps npm's own output out of the MSBuild log and lets setup-node cache the download.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: ODK.Web.Razor/package-lock.json

      - name: Install client libraries
        working-directory: ODK.Web.Razor
        run: npm ci

      - name: Restore
        run: dotnet restore odk.slnx

      - name: Build
        run: dotnet build odk.slnx --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Needed for the same reason as in the build job - the test run compiles the web project too.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: ODK.Web.Razor/package-lock.json

      - name: Install client libraries
        working-directory: ODK.Web.Razor
        run: npm ci

      - name: Restore
        run: dotnet restore odk.slnx

      - name: Test
        run: dotnet test odk.slnx --configuration Release --no-restore --verbosity normal
